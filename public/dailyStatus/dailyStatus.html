<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container">
            <nav>
                <ul class="nav-list">
                    <li><a href="../dashboard/dashboard.html">Home</a></li>  
                    <li><a href="../dailyStatus/dailyStatus.html">Daily Status</a></li>           
                </ul>
            </nav>
        </div>
    </header>

    <div class="addLog">
        <h2>Daily Check-In</h2>
  <form id="dailyStatus">
    

    <!-- Study Hours -->
    <label for="studyHours">Study Hours (0-16)</label>
    <input
      type="number" 
      id="studyHours" 
      name="studyHours" 
      min="0" 
      max="16" 
      step="0.5" 
      required
    />

    <!-- Sleep Hours -->
    <label for="sleepHours">Sleep Hours (0-12)</label>
    <input 
      type="number" 
      id="sleepHours" 
      name="sleepHours" 
      min="0" 
      max="12" 
      step="0.5" 
      required
    />

    <!-- Energy Level -->
    <label for="energy">Energy Level (1-5)</label>
    <select id="energy" name="energy" required>
      <option value="">Select</option>
      <option value="1">1 - Very Low</option>
      <option value="2">2 - Low</option>
      <option value="3">3 - Okay</option>
      <option value="4">4 - Good</option>
      <option value="5">5 - High</option>
    </select>

    <!-- Mood -->
    <label for="mood">Mood (1-5)</label>
    <select id="mood" name="mood" required>
      <option value="">Select</option>
      <option value="1">1 - Very Bad</option>
      <option value="2">2 - Bad</option>
      <option value="3">3 - Neutral</option>
      <option value="4">4 - Good</option>
      <option value="5">5 - Very Good</option>
    </select>

    <!-- Submit -->
    <button type="submit">Save</button>

  </form>
</div>

<div class="logsTable">

  <h3>Last 7 Days Status</h3>

  <table>
    <thead>
      <tr>
        <th>Date</th>
        <th>Study (hrs)</th>
        <th>Sleep (hrs)</th>
        <th>Energy</th>
        <th>Mood</th>
        <th>Status</th>
      </tr>
    </thead>

    <tbody id="tableBody">
      <!-- Example row -->
      <tr>
        <td>2025-01-10</td>
        <td>5</td>
        <td>6.5</td>
        <td>3</td>
        <td>4</td>
        <td class="status at-risk">At Risk</td>
      </tr>

      <tr>
        <td>2025-01-10</td>
        <td>5</td>
        <td>6.5</td>
        <td>3</td>
        <td>4</td>
        <td class="status healthy">Healthy</td>
      </tr>

      <tr>
        <td>2025-01-10</td>
        <td>5</td>
        <td>6.5</td>
        <td>3</td>
        <td>4</td>
        <td class="status burnout">Burnout</td>
      </tr>


      <!-- More rows will be injected dynamically -->
    </tbody>
  </table>

  <!-- Empty state -->
  <!--
  <p class="emptyState">No check-ins yet. Start by adding today’s data.</p>
  -->

</div>





    
 

    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.4.0/axios.min.js"></script>
    <script src="main.js"></script>
</body>
</html>
