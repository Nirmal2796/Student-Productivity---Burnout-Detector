<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container">
            <nav>
                <ul class="nav-list">
                    <li><a href="../dashboard/dashboard.html">Home</a></li>  
                    <li><a href="../dailyStatus/dailyStatus.html">Daily Status</a></li>     
                    <li><a href="../tasks/tasks.html">Tasks</a></li>        
                </ul>
            </nav>
        </div>
    </header>

<div class="task-page">
    <h2>Today's Tasks</h2>

    <form id="taskForm">
        <input type="text" id="taskInput" placeholder="Add a new task" required />
        <button type="submit">Add</button>
    </form>

</div>

<div class="task-div">
    <!-- <ul id="taskList">
        Tasks will appear here
    </ul> -->

    <table id="taskList">
    <thead>
      <tr>
        <th>Status</th>
        <th>Task</th>
        <th>Action</th>
      </tr>
    </thead>

    <tbody id="tableBody">
      <!-- Example row -->
       <tr>
        <td><input type="checkbox" name="status" id="status" checked></td>
       <td class="completed">task name</td>
       <td><button id="delete" >Delete</button></td>
       </tr>

      <!-- More rows will be injected dynamically -->
    </tbody>
  </table>
</div>


    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.4.0/axios.min.js"></script>
    <script src="main.js"></script>
</body>
</html>
